<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quip Clash — Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/host.css">
</head>
<body>
  <div id="status" class="status-dot"></div>
  <header id="top" hidden>
    <div class="logo small"><span class="a">Quip</span><span class="b">Clash</span></div>
    <div id="round" class="display"></div>
    <div class="top-right">
      <div id="timer" class="timer" hidden></div>
      <div id="code-badge" class="code-badge"></div>
    </div>
  </header>
  <main id="stage"></main>
  <footer id="controls" hidden>
    <button class="secondary" id="btn-sound" title="Toggle sound">🔊</button>
    <button class="secondary" id="btn-full" title="Fullscreen">⛶</button>
    <button class="secondary" id="btn-skip" title="Skip timer">Skip ⏭</button>
  </footer>
  <script type="module" src="/host.js"></script>
</body>
</html>
